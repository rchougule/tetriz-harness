syntax = "proto3";

package harnessctl.v1;

import "google/protobuf/timestamp.proto";
import "harnessctl/v1/types.proto";

option go_package = "github.com/tetriz-ai/tetriz-harness/gen/go/harnessctl/v1;harnessctlv1";

// AgentService is called by the agent on each developer machine with a bearer
// token the host maps to a person; every RPC is scoped to that person.
service AgentService {
  // GetEnforcedSet returns the caller's enforcement set: identities, paths
  // and hashes, no bodies. When every hash matches locally this is the only
  // call of a cycle.
  rpc GetEnforcedSet(GetEnforcedSetRequest) returns (GetEnforcedSetResponse);
  // GetArtifactBodies returns bodies by content hash. Only hashes in the
  // caller's own enforced set are served.
  rpc GetArtifactBodies(GetArtifactBodiesRequest) returns (GetArtifactBodiesResponse);
  // ReportState reports what is installed and what failed to apply. Status
  // is computed from it; it is the only proof of installation.
  rpc ReportState(ReportStateRequest) returns (ReportStateResponse);
}

message GetEnforcedSetRequest {}

// EnforcedFile is one file placed for an artifact.
message EnforcedFile {
  // relative_path is relative to the scope root; the primary's entry equals
  // EnforcedArtifact.install_path.
  string relative_path = 1;
  // content_hash is the sha256 hex of the body; the agent verifies a
  // downloaded body against it before writing.
  string content_hash = 2;
  // executable is set for a hook script.
  bool executable = 3;
}

// EnforcedArtifact is one artifact at one placement. A definition enforced at
// several placements for the caller appears once per placement.
message EnforcedArtifact {
  string artifact_id = 1;
  IdeType ide_type = 2;
  ArtifactType type = 3;
  string name = 4;
  ArtifactScope scope = 5;
  // repository is the "owner/repo" whose checkouts receive a REPO_LOCAL
  // artifact, matched against each checkout's git remote; empty for
  // USER_GLOBAL.
  string repository = 6;
  // install_path is the primary file's path relative to the scope root,
  // byte-identical to the source_path the agent reports for it.
  string install_path = 7;
  // primary_hash is the sha256 hex of the primary body: the status key.
  string primary_hash = 8;
  // files is the full placed set, primary first.
  repeated EnforcedFile files = 9;
  // hook_config and hook_command are set only for a HOOK: the settings entry
  // the agent merges, and the server-derived command it invokes. An empty
  // hook_command means the file is self-activating and needs no merge.
  HookConfig hook_config = 10;
  string hook_command = 11;
  // enforce_until is the close of the enforcement window.
  google.protobuf.Timestamp enforce_until = 12;
  // expired is server-computed so the agent never compares clocks. An
  // expired artifact is left exactly as it is: no write, no revert, no
  // settings change. Expired is not removal.
  bool expired = 13;
}

message GetEnforcedSetResponse {
  repeated EnforcedArtifact artifacts = 1;
  // paused is the org-wide kill switch: the agent makes no writes this cycle
  // and must not treat the (empty) artifact list as removal.
  bool paused = 2;
}

message GetArtifactBodiesRequest {
  // content_hashes to fetch; at most 100 per call.
  repeated string content_hashes = 1;
}

message ArtifactBody {
  string content_hash = 1;
  bytes content = 2;
}

message GetArtifactBodiesResponse {
  repeated ArtifactBody bodies = 1;
}

// InstalledArtifact is one managed file the agent found on disk. A report
// carries each (ide_type, repository, checkout, source_path) at most once.
// Status joins on (ide_type, repository, source_path): a placement is
// INSTALLED when any checkout's row carries the enforced hash, and a checkout
// holding other bytes does not by itself make it PENDING. Scope is
// deliberately absent so a file the engineer commits still reads as installed.
message InstalledArtifact {
  IdeType ide_type = 1;
  // repository is the "owner/repo" of the checkout; empty for USER_GLOBAL.
  string repository = 2;
  // source_path is relative to the scope root, in the same key space as
  // EnforcedArtifact.install_path.
  string source_path = 3;
  // content_hash is the sha256 hex of the file as found.
  string content_hash = 4;
  // checkout tells apart two checkouts of one repository on the device: an
  // opaque key, stable for a checkout and never a path. Empty for
  // USER_GLOBAL, and required to be empty when repository is.
  string checkout = 5;
}

// ApplyFailure is one convergence failure since the last report.
message ApplyFailure {
  string artifact_id = 1;
  // repository names the placement that failed; empty for USER_GLOBAL.
  string repository = 2;
  // content_hash is the primary hash the agent was trying to apply; a
  // failure for any other hash is stale and does not make status FAILED.
  string content_hash = 3;
  // reason is human-readable; the server truncates rather than rejects.
  string reason = 4;
}

message ReportStateRequest {
  // device_id is an attribute of the report, not part of any identity.
  string device_id = 1;
  string agent_version = 2;
  // known_repositories is every "owner/repo" with a checkout on this device;
  // it gates repo-local eligibility.
  repeated string known_repositories = 3;
  // installed is the complete set of managed files on this device; it
  // replaces the previous report.
  repeated InstalledArtifact installed = 4;
  repeated ApplyFailure apply_failures = 5;
}

message ReportStateResponse {}
