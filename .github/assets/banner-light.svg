<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Tetriz Harness: recommend harness changes from your codebase, then roll them out to the people you choose">
  <rect width="880" height="200" fill="#ffffff"/>
  <rect x="0" y="0" width="6" height="200" fill="#2d6cdf"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <text x="48" y="78" font-size="42" font-weight="700" fill="#14181f">Tetriz Harness</text>
  <text x="48" y="116" font-size="19" fill="#3b4453">Recommend harness changes from your codebase,</text>
  <text x="48" y="142" font-size="19" fill="#3b4453">then roll them out to the people you choose.</text>
  <text x="48" y="176" font-size="14" fill="#6b7280" font-weight="600" letter-spacing="1">RECOMMENDATIONS · CONTROL PLANE</text>

  <!-- per-file status: installed, installed, pending (control plane); flagged (recommendations) -->
  <g transform="translate(600,44)">
    <rect x="0" y="0" width="236" height="28" rx="5" fill="#eaf6ee"/>
    <circle cx="220" cy="14" r="6" fill="#2faa5a"/>
    <text x="14" y="19" font-size="13" fill="#277a44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.claude/skills/review</text>
    <rect x="0" y="38" width="236" height="28" rx="5" fill="#eaf6ee"/>
    <circle cx="220" cy="52" r="6" fill="#2faa5a"/>
    <text x="14" y="57" font-size="13" fill="#277a44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.agents/skills/review</text>
    <rect x="0" y="76" width="236" height="28" rx="5" fill="#fdf3e3"/>
    <circle cx="220" cy="90" r="6" fill="#d98a1a"/>
    <text x="14" y="95" font-size="13" fill="#8a5a12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.cursor/rules/go.mdc</text>
    <rect x="0" y="114" width="236" height="28" rx="5" fill="#fdecec"/>
    <circle cx="220" cy="128" r="6" fill="#d93a3a"/>
    <text x="14" y="133" font-size="13" fill="#8a2a2a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.claude/settings.json</text>
  </g>
</svg>
